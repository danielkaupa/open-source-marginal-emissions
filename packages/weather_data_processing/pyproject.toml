# packages/weather_data_processing/pyproject.toml

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-data-processing"
version = "1.0.0"
description = "ERA5 weather data processing pipeline: GRIB → masked → half-hourly → aggregated time-series"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Daniel Kaupa", email = "daniel.kaupa@outlook.com"}
]
keywords = ["era5", "weather", "reanalysis", "grib", "interpolation", "spatial-masking", "emissions"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "python-dateutil>=2.8.0",
    "osme-common",
    "pydantic>=2.0.0",
    "tqdm>=4.66",
    "geopandas>=0.14",
    "shapely>=2.0",
    "xarray>=2023.0.0",
    "cfgrib>=0.9.10",
    "eccodes>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
mpi = [
    "mpi4py>=3.1.0",
]

[project.scripts]
process-weather-data = "weather_data_processing.run_pipeline:main"
weather-data-processing = "weather_data_processing.run_pipeline:main"
weatherdataprocessing = "weather_data_processing.run_pipeline:main"
weatherprocessing = "weather_data_processing.run_pipeline:main"
weaproc = "weather_data_processing.run_pipeline:main"
wdp = "weather_data_processing.run_pipeline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["weather_data_processing*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"